<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ — Fun4Brain Escape Room Poznań</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* FAQ page hero */
  .faq-hero {
    padding: 120px 0 60px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(ellipse at 50% 0%, oklch(0.84 0.14 82 / 0.06), transparent 60%),
      var(--bg-0);
    position: relative;
    overflow: hidden;
  }
  .faq-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(oklch(1 0 0 / 0.025) 1px, transparent 1px),
      linear-gradient(90deg, oklch(1 0 0 / 0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  }
  .faq-hero-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 760px;
    margin: 0 auto;
  }
  .faq-hero h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(72px, 11vw, 160px);
    line-height: 0.88;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .faq-hero p {
    font-size: 18px;
    color: var(--text-muted);
    max-width: 56ch;
    margin: 0 auto;
  }
  .faq-breadcrumb {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 28px;
  }
  .faq-breadcrumb a { color: var(--text-muted); }
  .faq-breadcrumb a:hover { color: var(--accent); }
  .faq-help-cta {
    margin-top: 48px;
    text-align: center;
    padding: 48px 32px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--bg-1);
  }
  .faq-help-cta h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 36px;
    line-height: 0.95;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .faq-help-cta p {
    color: var(--text-muted);
    max-width: 48ch;
    margin: 0 auto 28px;
  }
  .faq-help-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="faq.jsx"></script>
<script type="text/babel" src="modal.jsx"></script>
<script type="text/babel" src="faq-app.jsx"></script>
</body>
</html>
